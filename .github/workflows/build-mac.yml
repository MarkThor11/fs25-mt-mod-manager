name: Build Mac Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to upload to (e.g. 1.0.10)'
        required: true
        default: '1.0.10'

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Mac App
        env:
          GITHUB_TOKEN: ${{ secrets.UPDATE_TOKEN }}
          GH_TOKEN: ${{ secrets.UPDATE_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npm run build
          # Build with ad-hoc signature (-) so Apple Silicon bundle integrity is valid
          ./node_modules/.bin/electron-builder --mac -c.mac.identity="-" -c.dmg.sign=false

      - name: Verify Mac DMG Auto-Update Script on macOS
        run: |
          DMG_FILE=$(ls release/*.dmg | head -n 1)
          echo "Testing auto-update extraction on $DMG_FILE"
          MOUNT_DIR=$(mktemp -d /tmp/fs25_verify_mount.XXXXXX)
          hdiutil attach "$DMG_FILE" -mountpoint "$MOUNT_DIR" -nobrowse -quiet -noautoopen
          SOURCE_APP=$(find "$MOUNT_DIR" -maxdepth 2 -name "*.app" -type d | head -n 1)
          if [ -z "$SOURCE_APP" ]; then
            echo "ERROR: .app not found inside DMG"
            exit 1
          fi
          TEST_DEST="/tmp/FS25 MT Mod Manager.app"
          rm -rf "$TEST_DEST"
          ditto "$SOURCE_APP" "$TEST_DEST"
          xattr -cr "$TEST_DEST"
          codesign --force --deep --sign - "$TEST_DEST"
          codesign --verify --deep --strict "$TEST_DEST"
          hdiutil detach "$MOUNT_DIR" -force -quiet
          rm -rf "$MOUNT_DIR" "$TEST_DEST"
          echo "Mac DMG auto-update verification passed!"

      - name: Upload to SEPARATE Mac Release
        uses: softprops/action-gh-release@v2
        with:
          # This ensures it goes to the dedicated Mac-only repo
          token: ${{ secrets.UPDATE_TOKEN }}
          repository: MarkThor11/fs25-mt-mod-manager-for-mac
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            release/*.dmg
            release/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.UPDATE_TOKEN }}
